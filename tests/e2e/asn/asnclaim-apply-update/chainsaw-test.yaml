---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: asnclaim-apply-update
  annotations:
    description: Tests if creation and update of AsnClaim is successful
spec:
  steps:
    - name: Apply CR
      try:
        - apply:
            file: netbox_v1_asnclaim.yaml
    - name: Check CR spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              metadata:
                name: asnclaim-apply-update
              spec:
                tenant: "MY_TENANT"
                description: "some description"
                comments: "your comments"
                preserveInNetbox: false
                parentAsnRange: "E2E Test ASN Range"
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'ASNAssigned']):
                  - status: 'True'
                asn: 64512
                asnName: asnclaim-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Asn
              metadata:
                name: asnclaim-apply-update
                finalizers:
                  - asn.netbox.dev/finalizer
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: AsnClaim
                    name: asnclaim-apply-update
              spec:
                comments: your comments
                description: some description
                asn: 64512
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Update CR
      try:
        - apply:
            file: netbox_v1_asnclaim-update.yaml
    - name: Check CR spec and status after update
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              metadata:
                name: asnclaim-apply-update
              spec:
                tenant: "MY_TENANT"
                description: "new description"
                comments: "new comments"
                preserveInNetbox: false
                parentAsnRange: "E2E Test ASN Range"
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'ASNAssigned']):
                  - status: 'True'
                asn: 64512
                asnName: asnclaim-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Asn
              metadata:
                name: asnclaim-apply-update
                finalizers:
                  - asn.netbox.dev/finalizer
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: AsnClaim
                    name: asnclaim-apply-update
              spec:
                comments: new comments
                description: new description
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Cleanup events
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=asnclaim-apply-update -n $NAMESPACE
