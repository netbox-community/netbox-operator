---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: asnclaim-restore
  annotations:
    description: Tests if creation, deletion and re-creation is successfully restoring the same ASN
spec:
  steps:
    - name: Apply CR 1
      try:
        - apply:
            file: netbox_v1_asnclaim_1.yaml
    - name: Check CR 1 spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              metadata:
                name: asnclaim-restore-1
              spec:
                comments: your comments
                description: some description
                parentAsnRange: "E2E Test ASN Range Restore"
                preserveInNetbox: true
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'ASNAssigned']):
                  - status: 'True'
                asn: 64700
                asnName: asnclaim-restore-1
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Asn
              metadata:
                name: asnclaim-restore-1
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: AsnClaim
                    name: asnclaim-restore-1
              spec:
                comments: your comments
                customFields:
                  netboxOperatorRestorationHash: 6b52c7ee152377f08fccd5686d2ca775a88555d6  # note that this will require the tests to run in the e2e namespace!
                description: some description
                asn: 64700
                preserveInNetbox: true
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Apply CR 2
      try:
        - apply:
            file: netbox_v1_asnclaim_2.yaml
    - name: Check CR 2 spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              metadata:
                name: asnclaim-restore-2
              spec:
                comments: your comments
                description: some description
                parentAsnRange: "E2E Test ASN Range Restore"
                preserveInNetbox: false
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'ASNAssigned']):
                  - status: 'True'
                asn: 64701
                asnName: asnclaim-restore-2
    - name: Delete CR 1
      description: delete CR 1 (preserveInNetbox=true, so the ASN stays in NetBox)
      try:
        - delete:
            ref:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              name: asnclaim-restore-1
    - name: Apply CR 1 again and check if restored
      try:
        - apply:
            file: netbox_v1_asnclaim_1.yaml
    - name: Check CR 1 spec and status and make sure it is restored
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              metadata:
                name: asnclaim-restore-1
              spec:
                comments: your comments
                description: some description
                parentAsnRange: "E2E Test ASN Range Restore"
                preserveInNetbox: true
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'ASNAssigned']):
                  - status: 'True'
                asn: 64700
                asnName: asnclaim-restore-1
    - name: Set preserveInNetbox to false
      description: Set preserveInNetbox to false to clean up the NetBox test instance
      try:
        - patch:
            resource:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              metadata:
                name: asnclaim-restore-1
              spec:
                preserveInNetbox: false
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: AsnClaim
              metadata:
                name: asnclaim-restore-1
              status:
                (conditions[?type == 'Ready']):
                  - observedGeneration: 2
                    status: 'True'
    - name: Cleanup events
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=asnclaim-restore-1 -n $NAMESPACE
              kubectl delete events --field-selector involvedObject.name=asnclaim-restore-2 -n $NAMESPACE
