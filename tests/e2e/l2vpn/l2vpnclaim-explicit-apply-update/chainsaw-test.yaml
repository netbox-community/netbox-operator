---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: l2vpnclaim-explicit-apply-update
  annotations:
    description: Tests if creation and update is successful for an explicit identifier
spec:
  steps:
    - name: Apply CR
      try:
        - apply:
            file: netbox_v1_l2vpnclaim.yaml
    - name: Check CR spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: L2VPNClaim
              metadata:
                name: l2vpnclaim-explicit-apply-update
              spec:
                tenant: "MY_TENANT"
                description: "some description"
                comments: "your comments"
                type: "vxlan-evpn"
                identifier: 5100001
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                identifier: 5100001
                l2VPNName: l2vpnclaim-explicit-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: L2VPN
              metadata:
                name: l2vpnclaim-explicit-apply-update
                finalizers:
                  - l2vpn.netbox.dev/finalizer
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: L2VPNClaim
                    name: l2vpnclaim-explicit-apply-update
              spec:
                comments: your comments
                description: some description
                type: vxlan-evpn
                identifier: 5100001
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                slug: l2vpnclaim-explicit-apply-update
    - name: Update CR
      try:
        - apply:
            file: netbox_v1_l2vpnclaim-update.yaml
    - name: Check CR spec and status after update
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: L2VPNClaim
              metadata:
                name: l2vpnclaim-explicit-apply-update
              spec:
                tenant: "MY_TENANT"
                description: "new description"
                comments: "new comments"
                type: "vxlan-evpn"
                identifier: 5100001
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                identifier: 5100001
                l2VPNName: l2vpnclaim-explicit-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: L2VPN
              metadata:
                name: l2vpnclaim-explicit-apply-update
              spec:
                comments: new comments
                description: new description
                identifier: 5100001
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Cleanup events and leases
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=l2vpnclaim-explicit-apply-update -n $NAMESPACE
