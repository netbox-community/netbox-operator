---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: routetargetclaim-range-apply-update
  annotations:
    description: Tests if creation and update is successful for a range-based claim
spec:
  steps:
    - name: Apply CR
      try:
        - apply:
            file: netbox_v1_routetargetclaim.yaml
    - name: Check CR spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: RouteTargetClaim
              metadata:
                name: routetargetclaim-range-apply-update
              spec:
                tenant: "MY_TENANT"
                asn: 64602
                assignedNumberRangeStart: 1
                assignedNumberRangeEnd: 10
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                routeTarget: "64602:1"
                routeTargetName: routetargetclaim-range-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: RouteTarget
              metadata:
                name: routetargetclaim-range-apply-update
                finalizers:
                  - routetarget.netbox.dev/finalizer
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: RouteTargetClaim
                    name: routetargetclaim-range-apply-update
              spec:
                routeTarget: "64602:1"
                comments: your comments
                description: some description
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Update CR
      try:
        - apply:
            file: netbox_v1_routetargetclaim-update.yaml
    - name: Check CR spec and status after update
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: RouteTargetClaim
              metadata:
                name: routetargetclaim-range-apply-update
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                routeTarget: "64602:1"
                routeTargetName: routetargetclaim-range-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: RouteTarget
              metadata:
                name: routetargetclaim-range-apply-update
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: RouteTargetClaim
                    name: routetargetclaim-range-apply-update
              spec:
                routeTarget: "64602:1"
                comments: new comments
                description: new description
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Cleanup events
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=routetargetclaim-range-apply-update -n $NAMESPACE
