---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: routetargetclaim-invalid-tenant
  annotations:
    description: Tests if creation fails when the referenced tenant does not exist
spec:
  steps:
    - name: Apply CR
      try:
        - apply:
            file: netbox_v1_routetargetclaim.yaml
    - name: Check CR spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: RouteTargetClaim
              metadata:
                name: routetargetclaim-invalid-tenant
              spec:
                tenant: "nonexistingtenant"
              status:
                (conditions[?type == 'RouteTargetAssigned']):
                  - status: 'False'
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: RouteTargetCRNotCreated
              source:
                component: route-target-claim-controller
              message: "Failed to fetch new route target from NetBox: failed to fetch tenant 'nonexistingtenant': not found"
              involvedObject:
                apiVersion: netbox.dev/v1
                kind: RouteTargetClaim
                name: routetargetclaim-invalid-tenant
    - name: Cleanup events
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=routetargetclaim-invalid-tenant -n $NAMESPACE
