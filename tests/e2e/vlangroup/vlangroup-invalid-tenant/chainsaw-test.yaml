---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vlangroup-invalid-tenant
  annotations:
    description: Tests if reservation fails when the referenced tenant does not exist
spec:
  steps:
    - name: Apply CR
      try:
        - apply:
            file: netbox_v1_vlangroup.yaml
    - name: Check CR spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanGroup
              metadata:
                name: vlangroup-invalid-tenant
              spec:
                tenant: "nonexistingtenant"
              status:
                (conditions[?type == 'Ready']):
                  - status: 'False'
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: FailedToReserveVLANGroupInNetbox
              source:
                component: vlan-group-controller
              message: "Failed to reserve VLAN Group in NetBox: failed to fetch tenant 'nonexistingtenant': not found, name: vlangroup-invalid-tenant"
              involvedObject:
                apiVersion: netbox.dev/v1
                kind: VlanGroup
                name: vlangroup-invalid-tenant
    - name: Cleanup events
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=vlangroup-invalid-tenant -n $NAMESPACE
