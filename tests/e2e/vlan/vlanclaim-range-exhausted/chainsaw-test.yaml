---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vlanclaim-range-exhausted
  annotations:
    description: Tests if creation fails once the vid range is exhausted
spec:
  steps:
    - name: Apply CR 1
      try:
        - apply:
            file: netbox_v1_vlanclaim_1.yaml
    - name: Check CR 1 spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-exhausted-1
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                vid: 130
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-exhausted-1
                finalizers:
                  - vlan.netbox.dev/finalizer
              spec:
                vid: 130
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Apply CR 2
      try:
        - apply:
            file: netbox_v1_vlanclaim_2.yaml
    - name: Check CR 2 spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-exhausted-2
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                vid: 131
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-exhausted-2
                finalizers:
                  - vlan.netbox.dev/finalizer
              spec:
                vid: 131
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Apply CR 3
      try:
        - apply:
            file: netbox_v1_vlanclaim_3.yaml
    - name: Check CR 3 spec and status and verify it fails
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-exhausted-3
              status:
                (conditions[?type == 'VlanAssigned']):
                  - status: 'False'
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: VlanCRNotCreated
              source:
                component: vlan-claim-controller
              message: "Failed to fetch new VID from NetBox: vlan vid range exhausted"
              involvedObject:
                apiVersion: netbox.dev/v1
                kind: VlanClaim
                name: vlanclaim-range-exhausted-3
    - name: Cleanup events and leases
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource and lease cleanup for preventing delays when using the same vid range
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=vlanclaim-range-exhausted-1 -n $NAMESPACE
              kubectl delete events --field-selector involvedObject.name=vlanclaim-range-exhausted-2 -n $NAMESPACE
              kubectl delete events --field-selector involvedObject.name=vlanclaim-range-exhausted-3 -n $NAMESPACE
