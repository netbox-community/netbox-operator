---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vlanclaim-invalid-customfieldnotexisting
  annotations:
    description: Tests if reservation in NetBox fails when a custom field is not registered
spec:
  steps:
    - name: Apply CR
      try:
        - apply:
            file: netbox_v1_vlanclaim.yaml
    - name: Check CR spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-invalid-customfieldnotexisting
              spec:
                customFields:
                  justmade: "thisup"
              status:
                (conditions[?type == 'VlanAssigned']):
                  - status: 'True'
                (conditions[?type == 'Ready']):
                  - status: 'False'
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                finalizers:
                  - vlan.netbox.dev/finalizer
                name: vlanclaim-invalid-customfieldnotexisting
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: VlanClaim
                    name: vlanclaim-invalid-customfieldnotexisting
              spec:
                customFields:
                  justmade: thisup
                vid: 160
              status:
                (conditions[?type == 'Ready']):
                  - status: 'False'
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: FailedToReserveVLANInNetbox
              source:
                component: vlan-controller
              message: "Failed to reserve VLAN in NetBox: failed to reserve vlan: status 400, body: {\"__all__\":[\"Unknown field name 'justmade' in custom field data.\"]}, vid: 160"
              involvedObject:
                apiVersion: netbox.dev/v1
                kind: Vlan
                name: vlanclaim-invalid-customfieldnotexisting
    - name: Cleanup events and leases
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource and lease cleanup for preventing delays when using the same vid range
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=vlanclaim-invalid-customfieldnotexisting -n $NAMESPACE
