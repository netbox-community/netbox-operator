---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vlanclaim-range-apply-update
  annotations:
    description: Tests if creation and update is successful for a range-based claim
spec:
  steps:
    - name: Apply CR
      try:
        - apply:
            file: netbox_v1_vlanclaim.yaml
    - name: Check CR spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-apply-update
              spec:
                tenant: "MY_TENANT"
                site: "MY_SITE"
                description: "some description"
                comments: "your comments"
                vidRangeStart: 110
                vidRangeEnd: 119
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                vid: 110
                vlanName: vlanclaim-range-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-apply-update
                finalizers:
                  - vlan.netbox.dev/finalizer
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: VlanClaim
                    name: vlanclaim-range-apply-update
              spec:
                comments: your comments
                description: some description
                vid: 110
                site: MY_SITE
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Update CR
      try:
        - apply:
            file: netbox_v1_vlanclaim-update.yaml
    - name: Check CR spec and status after update
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-apply-update
              spec:
                tenant: "MY_TENANT"
                site: "MY_SITE"
                description: "new description"
                comments: "new comments"
                vidRangeStart: 110
                vidRangeEnd: 119
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                vid: 110
                vlanName: vlanclaim-range-apply-update
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-apply-update
              spec:
                comments: new comments
                description: new description
                vid: 110
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Cleanup events and leases
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource and lease cleanup for preventing delays when using the same vid range
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=vlanclaim-range-apply-update -n $NAMESPACE
