---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vlanclaim-range-restore
  annotations:
    description: Tests if deletion and re-creation of a range-based claim restores the same vid instead of picking a new one
spec:
  steps:
    - name: Apply CR 1
      try:
        - apply:
            file: netbox_v1_vlanclaim_1.yaml
    - name: Check CR 1 spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-restore-1
              spec:
                comments: your comments
                description: some description
                vidRangeStart: 140
                vidRangeEnd: 149
                preserveInNetbox: true
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                vid: 140
                vlanName: vlanclaim-range-restore-1
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-restore-1
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: VlanClaim
                    name: vlanclaim-range-restore-1
              spec:
                vid: 140
                preserveInNetbox: true
                tenant: MY_TENANT
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Apply CR 2
      try:
        - apply:
            file: netbox_v1_vlanclaim_2.yaml
    - name: Check CR 2 spec and status
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-restore-2
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                vid: 141
                vlanName: vlanclaim-range-restore-2
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-restore-2
                finalizers:
                  - vlan.netbox.dev/finalizer
              spec:
                vid: 141
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Delete CR 1
      description: delete CR 1 (we only delete CR 1, so if the restoration failed to claim, it will take the next available vid which will be 142, not 140)
      try:
        - delete:
            ref:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              name: vlanclaim-range-restore-1
    - name: Apply CR 1 again and check if restored
      try:
        - apply:
            file: netbox_v1_vlanclaim_1.yaml
    - name: Check CR 1 spec and status and make sure it is restored
      try:
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-restore-1
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                vid: 140
                vlanName: vlanclaim-range-restore-1
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-restore-1
                ownerReferences:
                  - apiVersion: netbox.dev/v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: VlanClaim
                    name: vlanclaim-range-restore-1
              spec:
                vid: 140
                preserveInNetbox: true
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Set preserveInNetbox to false
      description: Set preserveInNetbox to false to clean up the NetBox test instance
      try:
        - patch:
            resource:
              apiVersion: netbox.dev/v1
              kind: VlanClaim
              metadata:
                name: vlanclaim-range-restore-1
              spec:
                preserveInNetbox: false
        - assert:
            resource:
              apiVersion: netbox.dev/v1
              kind: Vlan
              metadata:
                name: vlanclaim-range-restore-1
              status:
                (conditions[?type == 'Ready']):
                  - observedGeneration: 2
                    status: 'True'
    - name: Cleanup events and leases
      description: Events cleanup required to fix issues with failing tests that assert the wrong Error resource and lease cleanup for preventing delays when using the same vid range
      cleanup:
        - script:
            content: |-
              kubectl delete events --field-selector involvedObject.name=vlanclaim-range-restore-1 -n $NAMESPACE
              kubectl delete events --field-selector involvedObject.name=vlanclaim-range-restore-2 -n $NAMESPACE
